[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Serverless API Proxies (Zero-CORS para ComparaPix, ComparaDólar e Spot USD/BRL)
[[redirects]]
  from = "/api/comparapix"
  to = "/.netlify/functions/quotes?source=comparapix"
  status = 200
  force = true

[[redirects]]
  from = "/api/comparadolar"
  to = "/.netlify/functions/quotes?source=comparadolar"
  status = 200
  force = true

[[redirects]]
  from = "/api/usdbrl"
  to = "/.netlify/functions/quotes?source=usdbrl"
  status = 200
  force = true

# SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de PWA e Segurança
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
