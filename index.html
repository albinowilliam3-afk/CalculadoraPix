<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PesoPix • Calculadora Pix, Pesos &amp; Cartão</title>
    <meta
      name="description"
      content="PesoPix — calculadora inteligente em tempo real de Pesos, Pix, ARQ e Cartão USD (Dólar Oficial) para compras em Reais no Brasil."
    />

    <!-- Modern Web Guidance: Declare light & dark support + FOUC-free override -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme');
        if (storedScheme === 'light' || storedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = storedScheme;
        }
      } catch {}
    </script>

    <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E17" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PesoPix" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons: Web Neobank Icon for Browser Tab; PWA retains 3D custom app icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/web-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Plus Jakarta Sans typography for modern neobank clarity -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Netlify Badge & HUD Suppressor -->
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[title="Powered by Netlify"],
      iframe[title="Netlify"],
      iframe[id^="nl-"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: polygon(0 0, 0 0, 0 0, 0 0) !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        const removeNetlifyBadge = () => {
          const badElements = document.querySelectorAll(
            '#nl-badge-frame, #nl-hud-frame, iframe[title="Powered by Netlify"], iframe[title="Netlify"], script[data-nf-variant]'
          );
          badElements.forEach(el => el.remove());
        };
        removeNetlifyBadge();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver((mutations) => {
            for (const mutation of mutations) {
              for (const node of mutation.addedNodes) {
                if (node.nodeType === 1) {
                  if (
                    node.id === 'nl-badge-frame' ||
                    node.id === 'nl-hud-frame' ||
                    (node.tagName === 'IFRAME' && (node.title === 'Powered by Netlify' || node.title === 'Netlify')) ||
                    (node.tagName === 'SCRIPT' && node.dataset && node.dataset.nfVariant)
                  ) {
                    node.remove();
                  }
                }
              }
            }
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
